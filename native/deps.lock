# Native build inputs for Stream. fetch-deps.sh downloads each into .deps/ and stops on any mismatch.
# They are compiled into the app; the TV never downloads code. Columns, separated by spaces:
#   name  version  kind  pin  url  [extra]
# kind "tar": pin is the archive's SHA-256, as published upstream; extra lists the only paths to unpack.
# kind "git": pin is the commit; extra lists the submodules to fetch at the commits libtorrent records.
# Licenses: libtorrent BSD-3-Clause (COPYING), Boost BSL-1.0 (LICENSE_1_0.txt), OpenSSL Apache-2.0
# (LICENSE.txt); see THIRD_PARTY.md. Local changes to these sources live in patches/.
libtorrent 2.1.2 git 6da363d2994f17c0b3c0450d124cf73a31a73847 https://github.com/arvidn/libtorrent.git deps/try_signal
boost 1.90.0 tar 5e93d582aff26868d581a52ae78c7d8edf3f3064742c6e77901a1f18a437eea9 https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz boost,LICENSE_1_0.txt
openssl 3.5.9 tar 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
