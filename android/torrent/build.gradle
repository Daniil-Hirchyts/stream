plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android' }

// The streaming engine (native/core, Rust) built for each ABI: armeabi-v7a for the Fire TV Stick, arm64-v8a for
// the local emulator, x86_64 for Linux emulators in CI. The NDK version comes from the native lock; the Rust
// toolchain and crates from native/core's rust-toolchain.toml and Cargo.lock.
def nativeDir = file('../../native')
def coreDir = new File(nativeDir, 'core')
def lockedVersion = { String name ->
    def line = new File(nativeDir, 'deps.lock').readLines().find { it.startsWith(name + ' ') }
    if (line == null) throw new GradleException("deps.lock has no $name")
    line.split(/\s+/)[1]
}
def abis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']
// ABI: Rust target, NDK compiler prefix.
def rustTargets = [
    'armeabi-v7a': ['armv7-linux-androideabi', 'armv7a-linux-androideabi'],
    'arm64-v8a'  : ['aarch64-linux-android', 'aarch64-linux-android'],
    'x86_64'     : ['x86_64-linux-android', 'x86_64-linux-android'],
]
def minApi = 26
def rustOut = layout.buildDirectory.dir('rust')
def jniOut = layout.buildDirectory.dir('generated/rustJniLibs')

android {
    namespace 'tv.stream.torrent'
    compileSdk 36
    ndkVersion lockedVersion('ndk')
    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters(*abis) }
    }
    sourceSets { main { jniLibs.srcDirs += jniOut } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    // A library's test APK otherwise targets minSdk, and Play Protect blocks apps built for old Android.
    testOptions { targetSdk 36 }
    lint { targetSdk 36 }
}

dependencies {
    // Media3's DataSource for TorrentDataSource, at the version the player uses.
    api project(':playback')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}

// Cargo builds libstream_core.so per ABI with the NDK's clang as linker (and as C compiler for ring); the app
// loads it as libstream.so. Pages are 16 KiB aligned for Android 15 devices. Cargo decides what is up to date.
def cargoBin = new File(System.getProperty('user.home'), '.cargo/bin/cargo')
def rustTasks = abis.collect { abi ->
    def (target, prefix) = rustTargets[abi]
    def cargoTask = tasks.register("cargo-$abi", Exec) {
        def host = org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? 'darwin-x86_64' : 'linux-x86_64'
        def toolchain = new File(android.sdkDirectory, "ndk/${lockedVersion('ndk')}/toolchains/llvm/prebuilt/$host/bin")
        def clang = new File(toolchain, "${prefix}${minApi}-clang").absolutePath
        def envTarget = target.replace('-', '_')
        workingDir coreDir
        environment 'CARGO_TARGET_DIR', rustOut.get().asFile.absolutePath
        environment "CC_$envTarget", clang
        environment "AR_$envTarget", new File(toolchain, 'llvm-ar').absolutePath
        environment "CARGO_TARGET_${envTarget.toUpperCase()}_LINKER", clang
        environment "CARGO_TARGET_${envTarget.toUpperCase()}_RUSTFLAGS", '-C link-arg=-Wl,-z,max-page-size=16384'
        commandLine cargoBin.exists() ? cargoBin.absolutePath : 'cargo', 'build', '--release', '--locked', '--lib', '--target', target
    }
    tasks.register("rustLib-$abi", Copy) {
        dependsOn cargoTask
        from(rustOut.map { it.file("$target/release/libstream_core.so") })
        into(jniOut.map { it.dir(abi) })
        rename { 'libstream.so' }
    }
}
tasks.named('preBuild') { dependsOn rustTasks }
