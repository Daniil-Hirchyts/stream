plugins { id 'com.android.library' }

// The streaming engine (native) built for each ABI: armeabi-v7a for the Fire TV Stick, arm64-v8a for
// the local emulator, x86_64 for Linux emulators in CI. Versions come from the native dependency lock.
def nativeDir = file('../../native')
def lockedVersion = { String name ->
    def line = new File(nativeDir, 'deps.lock').readLines().find { it.startsWith(name + ' ') }
    if (line == null) throw new GradleException("deps.lock has no $name")
    line.split(/\s+/)[1]
}
def abis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']

android {
    namespace 'tv.stream.torrent'
    compileSdk 36
    ndkVersion lockedVersion('ndk')
    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters(*abis) }
        externalNativeBuild {
            cmake {
                arguments '-DDTV_JNI=ON', "-DDTV_DEPS_DIR=${nativeDir}/.deps", '-DANDROID_STL=c++_static'
                targets 'stream'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path new File(nativeDir, 'CMakeLists.txt')
            version lockedVersion('cmake')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // A library's test APK otherwise targets minSdk, and Play Protect blocks apps built for old Android.
    testOptions { targetSdk 36 }
    lint { targetSdk 36 }
}

dependencies {
    // Media3's DataSource for TorrentDataSource, at the version the player uses.
    api project(':playback')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}

// Pinned sources and OpenSSL for every ABI exist before CMake configures; both scripts skip finished work.
def nativeDeps = tasks.register('nativeDeps', Exec) {
    commandLine new File(nativeDir, 'fetch-deps.sh')
}
def opensslTasks = abis.collect { abi ->
    tasks.register("openssl-$abi", Exec) {
        dependsOn nativeDeps
        environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
        commandLine new File(nativeDir, 'build-openssl.sh'), abi
    }
}
tasks.named('preBuild') { dependsOn opensslTasks }
