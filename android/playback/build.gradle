plugins { id 'com.android.library' }
android {
    namespace 'tv.stream.playback'
    compileSdk 36
    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Includes fixes for active subtitle cues after seeking or enabling a track.
    // Keep the Android 8+ runtime minimum and target behavior independent of the build SDK.
    // Apps receive Media3 through this library, so both use one version.
    def media3 = '1.11.1'
    api "androidx.media3:media3-exoplayer:$media3"
    api "androidx.media3:media3-exoplayer-hls:$media3"
    api "androidx.media3:media3-exoplayer-dash:$media3"
    api "androidx.media3:media3-ui:$media3"
    // Nullability annotations; already resolved through Media3.
    api 'androidx.annotation:annotation:1.3.0'
}
