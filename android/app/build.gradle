plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
def releaseValidation = providers.gradleProperty('releaseValidation').orNull == 'true'
def separateTvApp = providers.gradleProperty('separateTvApp').orNull == 'true'
// Distribution: -PabiSplits=true adds one APK per ABI (sideloading, such as the Fire TV Stick's armeabi-v7a) beside the
// universal APK; :app:bundleRelease makes an App Bundle that stores serve per ABI. Run the bundle task without
// abiSplits: AGP cannot build a bundle from split-APK outputs. The option applies to all variants.
def abiSplits = providers.gradleProperty('abiSplits').orNull == 'true'

android {
    namespace 'tv.stream.app'
    compileSdk 36
    // The app performs final native symbol stripping; use the same pinned toolchain as :torrent.
    ndkVersion file('../../native/deps.lock').readLines().find { it.startsWith('ndk ') }.split(/\s+/)[1]
    defaultConfig {
        applicationId separateTvApp ? 'tv.stream.app.tvapp' : 'tv.stream.app'
        manifestPlaceholders = [launcherLabel: separateTvApp ? 'Stream TV' : '@string/app_name']
        minSdk 26
        targetSdk 36
        // A decoder dependency also ships x86; advertise only ABIs with the torrent engine.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        versionCode 4
        versionName '0.1.3'
        testInstrumentationRunner releaseValidation ? 'tv.stream.app.ReleaseProbeInstrumentation' : 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true; compose true }
    splits {
        abi {
            enable abiSplits
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
    bundle { abi { enableSplit true } }
    // Native libraries stay uncompressed and 16 KiB aligned in every APK and split, loaded in place.
    packaging { jniLibs { useLegacyPackaging false } }
    // JVM tests of the add-on protocol code; Android stubs answer defaults and org.json comes from its own artifact.
    // Robolectric UI snapshots need the merged resources.
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
    testBuildType releaseValidation ? 'release' : 'debug'
    buildTypes {
        release {
            if (releaseValidation) signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFile 'test-proguard-rules.pro'
        }
    }
}

dependencies {
    // Keep the existing Kotlin/AGP toolchain; the Compose compiler uses Kotlin's exact version.
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.compose.ui:ui'
    // Layout and text for page blocks drawn by Compose.
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation project(':torrent')
    implementation 'com.google.zxing:core:3.5.3'
    // Match :playback's Media3 version. Includes native audio + video fallbacks for all app ABIs.
    implementation project(':codecs')
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.Dimezis:BlurView:version-3.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestCompileOnly 'com.google.errorprone:error_prone_annotations:2.18.0'
}

// Live tests reach real add-ons and archive.org with real films; only `-PliveAddons=true` runs them.
// `-PuiSnapshots=true` renders the real browse screens at 1920×1080 into build/ui-snapshots (Robolectric, live Cinemeta).
tasks.withType(Test).configureEach {
    systemProperty 'dtv.live', providers.gradleProperty('liveAddons').getOrElse('false')
    systemProperty 'dtv.evidence', layout.buildDirectory.dir('live-evidence').get().asFile.path
    systemProperty 'dtv.snapshots', providers.gradleProperty('uiSnapshots').getOrElse('false')
    systemProperty 'dtv.snapshotDir', layout.buildDirectory.dir('ui-snapshots').get().asFile.path
    systemProperty 'robolectric.graphicsMode', 'NATIVE'
    systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
    // Robolectric's Android runtime reaches JDK internals on Java 17+.
    jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.nio=ALL-UNNAMED'
    outputs.upToDateWhen { !providers.gradleProperty('liveAddons').isPresent() && !providers.gradleProperty('uiSnapshots').isPresent() }
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = providers.gradleProperty('liveAddons').isPresent() }
}
