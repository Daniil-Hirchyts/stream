name: Daniil TV streaming
on:
  push:
    paths: ['streaming/**', 'android/playback/**', '.github/workflows/streaming.yml']
  pull_request:
    paths: ['streaming/**', 'android/playback/**', '.github/workflows/streaming.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [dev, asan, tsan, checks]
    steps:
      - uses: actions/checkout@v4
      - name: Pinned native sources
        uses: actions/cache@v4
        with:
          path: streaming/native/.deps
          key: native-deps-${{ runner.os }}-${{ hashFiles('streaming/native/deps.lock', 'streaming/native/patches/**', 'streaming/native/build-openssl.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Real seeders on loopback only: DHT, local discovery, port mapping and trackers stay off.
      - run: ./streaming/native/build-host.sh ${{ matrix.variant }}
  simulator-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A fake adb answers as the wrong device; no real device is contacted.
      - run: sh streaming/simulator/tests/identity.sh
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Pinned native sources
        uses: actions/cache@v4
        with:
          path: streaming/native/.deps
          key: native-deps-android-${{ hashFiles('streaming/native/deps.lock', 'streaming/native/patches/**', 'streaming/native/build-openssl.sh') }}
      # armeabi-v7a (Fire TV Stick), arm64-v8a (local emulator) and x86_64 (Linux emulators).
      - run: ./gradlew :torrent:assembleDebug :torrent:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
