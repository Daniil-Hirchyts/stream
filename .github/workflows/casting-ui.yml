name: Casting UI and receiver
on:
  push:
    paths: ['casting/extension/**', 'casting/sidepanel/**', 'casting/receiver/**', 'android/playback/**', '.github/workflows/casting-ui.yml']
  pull_request:
    paths: ['casting/extension/**', 'casting/sidepanel/**', 'casting/receiver/**', 'android/playback/**', '.github/workflows/casting-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casting/sidepanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: casting/sidepanel/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Check committed extension bundle
        run: git diff --exit-code -- ../extension/sidepanel
  receiver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casting/receiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: daniil-cast-receiver-debug
          path: casting/receiver/app/build/outputs/apk/debug/app-debug.apk
