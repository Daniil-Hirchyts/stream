name: Release
# Pushing a version tag (v0.1.3) builds the release APKs, signs them with the project's key and publishes them as a
# GitHub release with SHA-256 checksums. Signing needs four repository secrets (see docs/releasing.md); without them
# the run stops before anything is published, so an unsigned APK is never released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, such as v0.1.3'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Signing secrets present
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || { echo "::error::Missing signing secret for $name; see docs/releasing.md"; exit 1; }
          done
      - name: Tag matches versionName
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'/\1/p" android/app/build.gradle)
          [ "v$version" = "$TAG" ] || { echo "::error::Tag $TAG does not match versionName $version"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Pinned crates
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-release-${{ hashFiles('native/core/Cargo.lock') }}
      # One APK per ABI (armeabi-v7a for 32-bit sticks, arm64-v8a for most TVs, x86_64) and a universal APK.
      - name: Build release APKs
        working-directory: android
        run: ./gradlew :app:assembleRelease -PabiSplits=true
      - name: Align, sign and checksum
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          mkdir -p dist
          for apk in android/app/build/outputs/apk/release/*-release-unsigned.apk; do
            abi=$(basename "$apk" | sed -e 's/^app-//' -e 's/-release-unsigned\.apk$//')
            out="dist/stream-$TAG-$abi.apk"
            # 16 KiB alignment keeps the uncompressed native libraries loadable in place.
            "$tools/zipalign" -P 16 -f 4 "$apk" "$out"
            "$tools/apksigner" sign --ks "$keystore" --ks-pass env:STORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$out"
            "$tools/apksigner" verify "$out"
          done
          rm -f "$keystore"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          Install the APK for your TV's processor: **arm64-v8a** for most current TVs and boxes, **armeabi-v7a**
          for 32-bit sticks such as the first Fire TV Stick, or **universal** if unsure. Check downloads against
          SHA256SUMS.txt. See the README's Install section for sideloading steps.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Stream $TAG" --notes-file "$notes" --generate-notes --verify-tag
          fi
