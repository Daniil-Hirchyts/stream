name: Casting native helper
on:
  push:
    paths: ['casting/native/**', '.github/workflows/casting-native.yml']
  pull_request:
    paths: ['casting/native/**', '.github/workflows/casting-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: casting/native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Install conversion test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test AV1 conversion
        if: runner.os == 'Linux'
        run: cargo test --release --test conversion -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: daniil-cast-${{ matrix.os }}
          path: |
            casting/native/target/release/daniil-cast
            casting/native/target/release/daniil-cast.exe
