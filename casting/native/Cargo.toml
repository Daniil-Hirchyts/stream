[package]
name = "daniil-cast"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Daniil Cast desktop helper, converter and installer"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
hostname = "0.4"
if-addrs = "0.14"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
